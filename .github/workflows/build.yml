name: Build Codex Speculorum

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  books:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check project structure and schemas
        run: python scripts/check_project.py
      - name: Build and validate both editions
        run: python scripts/build.py
      - name: Upload reading edition
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Speculorum-reading
          if-no-files-found: error
          path: |
            binding/out/*.pdf
            binding/out/*.json
      - name: Upload illustrated edition
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Speculorum-illustrated
          if-no-files-found: error
          path: |
            binding/out/illustrated/*
      - name: Upload component proofs
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Speculorum-components
          if-no-files-found: error
          path: |
            books/*/out/*
            books/*/build/*
            books/*/canon/out/*
